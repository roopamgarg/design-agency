<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Agency — Project Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --color-bg: #FAFBFC;
      --color-surface: #FFFFFF;
      --color-elevated: #F1F5F9;
      --color-text: #0F172A;
      --color-text-secondary: #475569;
      --color-text-muted: #94A3B8;
      --color-border: #E2E8F0;
      --color-accent: #4F46E5;
      --color-accent-light: rgba(79, 70, 229, 0.08);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.1);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font-ui);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* --- Header --- */
    .site-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-text);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--color-accent);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    .logo-text {
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: -0.02em;
    }

    .header-meta {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    /* --- Hero --- */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 24px 40px;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .hero p {
      margin-top: 12px;
      font-size: 1.0625rem;
      color: var(--color-text-secondary);
      max-width: 560px;
      line-height: 1.6;
    }

    .stats-row {
      display: flex;
      gap: 32px;
      margin-top: 28px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* --- Projects grid --- */
    .projects-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 640px)  { .project-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px)  { .project-grid { grid-template-columns: repeat(3, 1fr); } }

    .project-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: box-shadow 200ms ease, transform 200ms ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-preview {
      height: 180px;
      position: relative;
      overflow: hidden;
    }

    .card-preview-inner {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 12px;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    }

    .preview-screen {
      background: var(--color-surface);
      border-radius: 4px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-description {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-top: 6px;
      line-height: 1.5;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }
    .meta-item svg { width: 14px; height: 14px; flex-shrink: 0; }

    .card-colors { display: flex; gap: 4px; margin-left: auto; }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
    }

    .card-action {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-accent);
      margin-top: 16px;
    }
    .card-action svg { width: 14px; height: 14px; transition: transform 200ms ease; }
    .project-card:hover .card-action svg { transform: translateX(3px); }

    /* --- Inline preview overlay --- */
    .preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--color-bg);
      flex-direction: column;
    }
    .preview-overlay.open { display: flex; }

    .preview-toolbar {
      height: 52px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
    }

    .preview-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      background: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 120ms;
    }
    .preview-back-btn:hover { background: var(--color-elevated); }
    .preview-back-btn svg { width: 14px; height: 14px; }

    .preview-divider { width: 1px; height: 24px; background: var(--color-border); }

    .preview-project-name {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-text);
    }

    .preview-spacer { flex: 1; }

    .preview-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms;
    }
    .preview-nav-btn:hover:not(:disabled) { background: var(--color-elevated); }
    .preview-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .preview-nav-btn svg { width: 14px; height: 14px; }

    .preview-screen-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text);
      min-width: 140px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-accent);
      background: var(--color-accent-light);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 120ms;
      white-space: nowrap;
    }
    .open-tab-btn:hover { background: rgba(79, 70, 229, 0.14); }
    .open-tab-btn svg { width: 12px; height: 12px; }

    .open-project-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      background: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 120ms;
      white-space: nowrap;
    }
    .open-project-btn:hover { background: var(--color-elevated); }
    .open-project-btn svg { width: 12px; height: 12px; }

    .preview-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .preview-sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      transition: margin-left 250ms ease, visibility 250ms;
    }

    .preview-sidebar.collapsed {
      margin-left: -280px;
      visibility: hidden;
    }

    .sidebar-toggle-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 120ms;
      flex-shrink: 0;
    }
    .sidebar-toggle-btn:hover { background: var(--color-elevated); }
    .sidebar-toggle-btn svg { width: 16px; height: 16px; }

    .preview-sidebar-section { padding: 14px 10px 6px; }

    .preview-sidebar-title {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .screen-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: var(--color-text);
      transition: background 120ms;
    }
    .screen-btn:hover { background: var(--color-elevated); }
    .screen-btn.active { background: var(--color-accent-light); }

    .screen-btn-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-elevated);
      color: var(--color-text-secondary);
      font-size: 0.625rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
    }
    .screen-btn.active .screen-btn-num { background: var(--color-accent); color: #fff; }

    .screen-btn-name {
      font-size: 0.8125rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-iframe-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--color-elevated);
      overflow: hidden;
    }

    .device-frame {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--color-border);
    }

    .device-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* --- Footer --- */
    .site-footer {
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      padding: 24px;
      text-align: center;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }
    .footer-inner a { color: var(--color-accent); text-decoration: none; }
    .footer-inner a:hover { text-decoration: underline; }

    @media (max-width: 639px) {
      .hero h1 { font-size: 1.625rem; }
      .hero { padding: 40px 20px 32px; }
      .projects-section { padding: 0 20px 60px; }
      .stats-row { gap: 24px; }
      .header-meta { display: none; }
    }

    .open-tab-btn .btn-label { white-space: nowrap; }

    @media (max-width: 768px) {
      .preview-sidebar { margin-left: -280px; visibility: hidden; }
      .preview-sidebar.expanded { margin-left: 0; visibility: visible; }
      .sidebar-toggle-btn { display: flex; }
      .preview-iframe-wrap { padding: 12px; }
      .device-frame { max-width: 100%; border-radius: var(--radius-md); }
      .open-tab-btn .btn-label { display: none; }
      .open-tab-btn { padding: 6px 8px; gap: 0; }
    }

    @media (min-width: 769px) {
      .preview-sidebar.collapsed { margin-left: -280px; visibility: hidden; }
      .sidebar-toggle-btn { display: flex; }
    }
  </style>
</head>

      </div>
    </div>
  </div>

          ]},
          { group: "Profile", items: [
            { num: 8,  file: "profile.html",        name: "My Profile" },
            { num: 9,  file: "profile-detail.html", name: "Profile Detail" },
          ]},
          { group: "Settings & Utilities", items: [
            { num: 10, file: "settings.html",      name: "Settings" },
            { num: 11, file: "notifications.html", name: "Notifications" },
            { num: 12, file: "states.html",        name: "States" },
          ]},
        ]
      }
    ];

    /* ---- Portfolio grid ---- */
    function renderGrid() {
      const grid = document.getElementById("project-grid");
      const totalScreens = PROJECTS.reduce((s, p) => s + p.totalScreens, 0);
      document.getElementById("stat-projects").textContent = PROJECTS.length;
      document.getElementById("stat-screens").textContent = totalScreens;

      grid.innerHTML = PROJECTS.map((p, pi) => `
        <div class="project-card" data-project="${pi}">
          <div class="card-preview">
            <div class="card-preview-inner">
              ${Array.from({ length: Math.min(p.totalScreens, 8) }, () => '<div class="preview-screen"></div>').join("")}
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${p.name}</div>
            <div class="card-description">${p.description}</div>
            <div class="card-meta">
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                ${p.totalScreens} screens
              </span>
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                ${p.categories.length} sections
              </span>
              <div class="card-colors">
                ${p.colors.slice(0, 4).map(c => `<span class="color-dot" style="background:${c}"></span>`).join("")}
              </div>
            </div>
            <div class="card-action">
              Open project
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
          </div>
        </div>
      `).join("");

      grid.addEventListener("click", (e) => {
        const card = e.target.closest(".project-card");
        if (!card) return;
        const project = PROJECTS[parseInt(card.dataset.project, 10)];
        window.location.href = project.href;
      });
    }

    /* ---- Inline preview ---- */
    let currentProject = null;
    let flatScreens = [];
    let activeIdx = 0;

    const overlay   = document.getElementById("preview-overlay");
    const pvName    = document.getElementById("preview-project-name");
    const pvSidebar = document.getElementById("pv-sidebar");
    const pvIframe  = document.getElementById("pv-iframe");
    const pvLabel   = document.getElementById("pv-label");
    const pvPrev    = document.getElementById("pv-prev");
    const pvNext    = document.getElementById("pv-next");
    const pvOpenTab = document.getElementById("pv-open-tab");
    const pvOpenPrj = document.getElementById("pv-open-project");
    const pvClose   = document.getElementById("preview-close");
    const sidebarToggle = document.getElementById("sidebar-toggle");

    function isMobile() { return window.matchMedia("(max-width: 768px)").matches; }

    function openPreview(projectIdx) {
      currentProject = PROJECTS[projectIdx];
      flatScreens = currentProject.screens.flatMap(g => g.items);

      pvName.textContent = currentProject.name;
      pvOpenPrj.onclick = () => window.open(currentProject.href, "_blank");

      pvSidebar.innerHTML = currentProject.screens.map(g => `
        <div class="preview-sidebar-section">
          <div class="preview-sidebar-title">${g.group}</div>
          ${g.items.map(s => {
            const idx = flatScreens.indexOf(s);
            return `<button class="screen-btn" data-idx="${idx}">
              <span class="screen-btn-num">${s.num}</span>
              <span class="screen-btn-name">${s.name}</span>
            </button>`;
          }).join("")}
        </div>
      `).join("");

      pvSidebar.addEventListener("click", (e) => {
        const btn = e.target.closest(".screen-btn");
        if (!btn) return;
        selectPreview(parseInt(btn.dataset.idx, 10));
      });

      pvSidebar.classList.remove("collapsed", "expanded");

      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
      selectPreview(0);
    }

    function closePreview() {
      overlay.classList.remove("open");
      document.body.style.overflow = "";
      pvIframe.src = "about:blank";
    }

    function selectPreview(idx) {
      if (idx < 0 || idx >= flatScreens.length) return;
      activeIdx = idx;
      const s = flatScreens[idx];
      const src = currentProject.screenBase + s.file;

      pvIframe.src = src;
      pvLabel.textContent = `${s.num}. ${s.name}`;
      pvPrev.disabled = idx === 0;
      pvNext.disabled = idx === flatScreens.length - 1;

      pvSidebar.querySelectorAll(".screen-btn").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      const activeBtn = pvSidebar.querySelector(".screen-btn.active");
      if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    pvPrev.addEventListener("click", () => selectPreview(activeIdx - 1));
    pvNext.addEventListener("click", () => selectPreview(activeIdx + 1));
    pvOpenTab.addEventListener("click", () => {
      window.open(currentProject.screenBase + flatScreens[activeIdx].file, "_blank");
    });
    pvClose.addEventListener("click", closePreview);

    sidebarToggle.addEventListener("click", () => {
      if (isMobile()) {
        pvSidebar.classList.toggle("expanded");
      } else {
        pvSidebar.classList.toggle("collapsed");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!overlay.classList.contains("open")) return;
      if (e.key === "Escape") { closePreview(); return; }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); selectPreview(activeIdx - 1); }
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); selectPreview(activeIdx + 1); }
    });

    renderGrid();
  </script>
</body>
</html>
