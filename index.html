<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Agency — Project Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --color-bg: #FAFBFC;
      --color-surface: #FFFFFF;
      --color-text: #0F172A;
      --color-text-secondary: #475569;
      --color-text-muted: #94A3B8;
      --color-border: #E2E8F0;
      --color-accent: #4F46E5;
      --color-accent-light: rgba(79, 70, 229, 0.08);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.1);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-ui);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.5;
      min-height: 100vh;
    }

    .site-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-text);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--color-accent);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 18px;
      height: 18px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: -0.02em;
    }

    .header-meta {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 24px 40px;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--color-text);
    }

    .hero p {
      margin-top: 12px;
      font-size: 1.0625rem;
      color: var(--color-text-secondary);
      max-width: 560px;
      line-height: 1.6;
    }

    .stats-row {
      display: flex;
      gap: 32px;
      margin-top: 28px;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .projects-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 640px) {
      .project-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 960px) {
      .project-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .project-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: box-shadow 200ms ease, transform 200ms ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      text-decoration: none;
      color: inherit;
    }

    .card-preview {
      height: 180px;
      position: relative;
      overflow: hidden;
    }

    .card-preview-inner {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 12px;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    }

    .preview-screen {
      background: var(--color-surface);
      border-radius: 4px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-description {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-top: 6px;
      line-height: 1.5;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .meta-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .card-colors {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
    }

    .card-action {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-accent);
      margin-top: 16px;
    }

    .card-action svg {
      width: 14px;
      height: 14px;
      transition: transform 200ms ease;
    }

    .project-card:hover .card-action svg {
      transform: translateX(3px);
    }

    .site-footer {
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      padding: 24px;
      text-align: center;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }

    .footer-inner a {
      color: var(--color-accent);
      text-decoration: none;
    }

    .footer-inner a:hover {
      text-decoration: underline;
    }

    @media (max-width: 639px) {
      .hero h1 { font-size: 1.625rem; }
      .hero { padding: 40px 20px 32px; }
      .projects-section { padding: 0 20px 60px; }
      .stats-row { gap: 24px; }
      .header-meta { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </div>
        <span class="logo-text">Design Agency</span>
      </a>
      <span class="header-meta">Project Portfolio</span>
    </div>
  </header>

  <section class="hero">
    <h1>Project Outputs</h1>
    <p>Browse design deliverables by project. Each project contains full UI screen designs, prototypes, and design system assets.</p>
    <div class="stats-row" id="stats-row">
      <div class="stat">
        <span class="stat-value" id="stat-projects">--</span>
        <span class="stat-label">Projects</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-screens">--</span>
        <span class="stat-label">Screens</span>
      </div>
    </div>
  </section>

  <main class="projects-section">
    <div class="section-header">
      <span class="section-title">All Projects</span>
    </div>
    <div class="project-grid" id="project-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      Design Agency &mdash; <a href="https://github.com/roopamgarg/design-agency" target="_blank" rel="noopener">View on GitHub</a>
    </div>
  </footer>

  <script>
    const PROJECTS = [
      {
        slug: "storycraft",
        name: "StoryCraft",
        description: "Voice coaching app — practice storytelling daily with AI-powered feedback, progress tracking, and community challenges.",
        screens: 16,
        categories: ["Onboarding", "Core", "Learning", "Community", "Settings"],
        colors: ["#4F46E5", "#3730A3", "#EF4444", "#10B981", "#F59E0B"],
        href: "output/storycraft/index.html"
      }
    ];

    function renderProjects() {
      const grid = document.getElementById("project-grid");
      const totalScreens = PROJECTS.reduce((sum, p) => sum + p.screens, 0);

      document.getElementById("stat-projects").textContent = PROJECTS.length;
      document.getElementById("stat-screens").textContent = totalScreens;

      grid.innerHTML = PROJECTS.map(project => `
        <a href="${project.href}" class="project-card">
          <div class="card-preview">
            <div class="card-preview-inner">
              ${Array.from({ length: Math.min(project.screens, 8) }, () =>
                '<div class="preview-screen"></div>'
              ).join("")}
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${project.name}</div>
            <div class="card-description">${project.description}</div>
            <div class="card-meta">
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                ${project.screens} screens
              </span>
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                ${project.categories.length} sections
              </span>
              <div class="card-colors">
                ${project.colors.slice(0, 4).map(c =>
                  `<span class="color-dot" style="background:${c}"></span>`
                ).join("")}
              </div>
            </div>
            <div class="card-action">
              View screens
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
          </div>
        </a>
      `).join("");
    }

    renderProjects();
  </script>
</body>
</html>
