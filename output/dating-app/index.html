<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dating App — UI Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --elevated: #F1F5F9;
      --text-1: #0F172A;
      --text-2: #475569;
      --text-3: #94A3B8;
      --border: #E2E8F0;
      --accent: #E11D48;
      --accent-light: rgba(225, 29, 72, 0.08);
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --sidebar-w: 320px;
      --toolbar-h: 48px;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-ui);
      color: var(--text-1);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: var(--toolbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background 150ms;
    }
    .back-link:hover { background: var(--elevated); text-decoration: none; }
    .back-link svg { width: 14px; height: 14px; }

    .top-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .project-title {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .top-bar-spacer { flex: 1; }

    .screen-counter {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-3);
    }

    .shell {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section {
      padding: 16px 12px 8px;
    }

    .sidebar-section-title {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .screen-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 120ms;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: var(--text-1);
    }
    .screen-item:hover { background: var(--elevated); }
    .screen-item.active { background: var(--accent-light); }
    .screen-item.active .screen-item-num { background: var(--accent); }

    .screen-item-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--elevated);
      color: var(--text-2);
      font-size: 0.6875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
    }
    .screen-item.active .screen-item-num { color: #fff; }

    .screen-item-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--elevated);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
    }
    .screen-item.active .screen-item-icon { background: var(--accent); color: #fff; }
    .screen-item-icon svg { width: 14px; height: 14px; }

    .screen-item-text {
      flex: 1;
      min-width: 0;
    }

    .screen-item-name {
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .screen-item-desc {
      font-size: 0.6875rem;
      color: var(--text-3);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--elevated);
    }

    .preview-toolbar {
      height: var(--toolbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
    }

    .preview-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms;
    }
    .preview-nav-btn:hover:not(:disabled) { background: var(--elevated); }
    .preview-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .preview-nav-btn svg { width: 14px; height: 14px; }

    .preview-screen-name {
      flex: 1;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-1);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 120ms;
      white-space: nowrap;
    }
    .open-tab-btn:hover { background: rgba(225, 29, 72, 0.14); }
    .open-tab-btn svg { width: 12px; height: 12px; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms, color 120ms;
    }
    .theme-toggle-btn:hover { background: var(--elevated); }
    .theme-toggle-btn svg { width: 16px; height: 16px; }
    .theme-toggle-btn .icon-moon { display: none; }
    .theme-toggle-btn.dark { background: #1E1E2E; color: #F5F0EB; border-color: #3A3530; }
    .theme-toggle-btn.dark .icon-sun { display: none; }
    .theme-toggle-btn.dark .icon-moon { display: block; }

    .mode-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .mode-toggle-btn {
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 120ms, color 120ms;
      background: var(--surface);
      color: var(--text-3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .mode-toggle-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .mode-toggle-btn:hover { background: var(--elevated); color: var(--text-2); }
    .mode-toggle-btn.active { background: var(--accent); color: #fff; }
    .mode-toggle-btn svg { width: 12px; height: 12px; }

    .preview-frame-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .preview-frame-wrap[data-mode="screenshots"] {
      overflow-y: auto;
      align-items: flex-start;
    }

    .device-frame {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }

    .device-frame iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    .screenshots-view {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
    }

    .preview-frame-wrap[data-mode="screenshots"] .device-frame { display: none; }
    .preview-frame-wrap[data-mode="screenshots"] .screenshots-view { display: flex; }

    .viewport-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .viewport-toggle-btn {
      padding: 5px 14px;
      font-family: inherit;
      font-size: 0.6875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: var(--surface);
      color: var(--text-3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 120ms, color 120ms;
    }
    .viewport-toggle-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .viewport-toggle-btn:hover { background: var(--elevated); color: var(--text-2); }
    .viewport-toggle-btn.active { background: var(--text-1); color: #fff; }
    .viewport-toggle-btn svg { width: 12px; height: 12px; }

    .screenshot-frame {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      width: 100%;
    }

    .screenshot-frame img {
      display: block;
      height: auto;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    .screenshot-frame[data-viewport="mobile"] img {
      max-width: 390px;
      width: 100%;
    }

    .screenshot-frame[data-viewport="desktop"] img {
      max-width: 100%;
      width: 100%;
    }

    @media (max-width: 768px) {
      :root { --sidebar-w: 100%; }
      .shell { flex-direction: column; }
      .sidebar {
        width: 100%;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .sidebar.collapsed { display: none; }
      .preview-frame-wrap { padding: 12px; }
      .device-frame { max-width: 100%; border-radius: var(--radius-md); }
      .toggle-sidebar-btn { display: flex; }
    }

    .toggle-sidebar-btn {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    .toggle-sidebar-btn svg { width: 16px; height: 16px; }

    @media (max-width: 768px) {
      .toggle-sidebar-btn { display: flex; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../../index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      All Projects
    </a>
    <div class="top-divider"></div>
    <span class="project-title">Dating App</span>
    <span class="top-bar-spacer"></span>
    <span class="screen-counter" id="counter">14 screens</span>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="preview-panel">
      <div class="preview-toolbar">
        <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle screen list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="preview-nav-btn" id="btn-prev" aria-label="Previous screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="preview-screen-name" id="preview-title">&mdash;</span>
        <button class="preview-nav-btn" id="btn-next" aria-label="Next screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="mode-toggle" id="mode-toggle">
          <button class="mode-toggle-btn active" data-mode="live">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Live
          </button>
          <button class="mode-toggle-btn" data-mode="screenshots">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Screenshots
          </button>
        </div>
        <button class="open-tab-btn" id="btn-open-tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open in new tab
        </button>
      </div>

      <div class="preview-frame-wrap" id="preview-frame-wrap">
        <div class="device-frame">
          <iframe id="preview-iframe" title="Screen preview"></iframe>
        </div>
        <div class="screenshots-view" id="screenshots-view">
          <div class="viewport-toggle" id="viewport-toggle">
            <button class="viewport-toggle-btn active" data-viewport="mobile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
              Mobile
            </button>
            <button class="viewport-toggle-btn" data-viewport="desktop">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              Desktop
            </button>
          </div>
          <div class="screenshot-frame" id="screenshot-frame" data-viewport="mobile">
            <img id="screenshot-img" alt="Screenshot preview">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function screenshotPaths(htmlFile) {
      const dir = htmlFile.includes("prototypes/") ? "prototypes" : "screens";
      const slug = htmlFile.split("/").pop().replace(".html", "");
      return {
        desktop: `${dir}/screenshots/${slug}-desktop.png`,
        mobile:  `${dir}/screenshots/${slug}-mobile.png`,
      };
    }

    const SCREENS = [
      { group: "Onboarding", items: [
        { num: 1,  file: "screens/welcome.html",            name: "Welcome",            desc: "Landing screen with value proposition" },
        { num: 2,  file: "screens/sign-up.html",            name: "Sign Up",             desc: "Registration with social + email auth" },
        { num: 3,  file: "screens/onboarding-profile.html", name: "Onboarding Profile",  desc: "Profile setup — photos, bio, preferences" },
      ]},
      { group: "Discovery", items: [
        { num: 4,  file: "screens/discover.html",           name: "Discover",            desc: "Swipe-based profile discovery feed" },
        { num: 5,  file: "screens/matches.html",            name: "Matches",             desc: "View and manage mutual matches" },
      ]},
      { group: "Messaging", items: [
        { num: 6,  file: "screens/messages.html",           name: "Messages",            desc: "Conversation list with match threads" },
        { num: 7,  file: "screens/chat.html",               name: "Chat",                desc: "1-on-1 messaging with a match" },
      ]},
      { group: "Profile", items: [
        { num: 8,  file: "screens/profile.html",            name: "My Profile",          desc: "View and edit own profile" },
        { num: 9,  file: "screens/profile-detail.html",     name: "Profile Detail",      desc: "Expanded view of another user's profile" },
      ]},
      { group: "Settings & Utilities", items: [
        { num: 10, file: "screens/settings.html",           name: "Settings",            desc: "App preferences and account management" },
        { num: 11, file: "screens/notifications.html",      name: "Notifications",       desc: "Activity alerts and match updates" },
        { num: 12, file: "screens/states.html",             name: "States",              desc: "Empty, error, and loading states" },
      ]},
      { group: "Prototypes", type: "prototype", items: [
        { num: "P1", file: "prototypes/onboarding-discovery-flow.html", name: "Onboarding & Discovery Flow", desc: "Interactive onboarding-to-swipe prototype" },
        { num: "P2", file: "prototypes/secondary-flows.html",          name: "Secondary Flows",             desc: "Messaging, profile, settings interactions" },
      ]},
    ];

    SCREENS.forEach(g => g.items.forEach(s => { s.screenshots = screenshotPaths(s.file); }));

    const flatScreens = SCREENS.flatMap(g => g.items);
    let activeIndex = 0;
    let viewMode = "live";
    let currentTheme = "light";

    const sidebar        = document.getElementById("sidebar");
    const iframe         = document.getElementById("preview-iframe");
    const titleEl        = document.getElementById("preview-title");
    const btnPrev        = document.getElementById("btn-prev");
    const btnNext        = document.getElementById("btn-next");
    const btnOpenTab     = document.getElementById("btn-open-tab");
    const btnToggle      = document.getElementById("toggle-sidebar");
    const frameWrap      = document.getElementById("preview-frame-wrap");
    const screenshotsDiv = document.getElementById("screenshots-view");
    const modeToggle     = document.getElementById("mode-toggle");

    const protoIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

    function buildSidebar() {
      sidebar.innerHTML = SCREENS.map(group => `
        <div class="sidebar-section">
          <div class="sidebar-section-title">${group.group}</div>
          ${group.items.map(s => {
            const idx = flatScreens.indexOf(s);
            const isProto = group.type === "prototype";
            const badge = isProto
              ? `<span class="screen-item-icon">${protoIcon}</span>`
              : `<span class="screen-item-num">${s.num}</span>`;
            return `<button class="screen-item" data-idx="${idx}">
              ${badge}
              <div class="screen-item-text">
                <div class="screen-item-name">${s.name}</div>
                <div class="screen-item-desc">${s.desc}</div>
              </div>
            </button>`;
          }).join("")}
        </div>
      `).join("");

      sidebar.addEventListener("click", (e) => {
        const btn = e.target.closest(".screen-item");
        if (!btn) return;
        selectScreen(parseInt(btn.dataset.idx, 10));
      });
    }

    let screenshotViewport = "mobile";
    const screenshotImg    = document.getElementById("screenshot-img");
    const screenshotFrame  = document.getElementById("screenshot-frame");
    const viewportToggle   = document.getElementById("viewport-toggle");

    function renderScreenshots(s) {
      const ss = s.screenshots;
      const src = screenshotViewport === "mobile" ? ss.mobile : ss.desktop;
      screenshotImg.src = src;
      screenshotImg.alt = `${s.name} — ${screenshotViewport}`;
      screenshotFrame.dataset.viewport = screenshotViewport;
    }

    function setViewMode(mode) {
      viewMode = mode;
      frameWrap.dataset.mode = mode;
      modeToggle.querySelectorAll(".mode-toggle-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      const s = flatScreens[activeIndex];
      if (mode === "screenshots") {
        renderScreenshots(s);
        iframe.src = "about:blank";
      } else {
        iframe.src = s.file;
      }
    }

    function selectScreen(idx) {
      if (idx < 0 || idx >= flatScreens.length) return;
      activeIndex = idx;
      const s = flatScreens[idx];

      if (viewMode === "live") {
        iframe.src = s.file;
      } else {
        renderScreenshots(s);
      }

      titleEl.textContent = typeof s.num === "number" ? `${s.num}. ${s.name}` : `${s.name}`;
      btnPrev.disabled = idx === 0;
      btnNext.disabled = idx === flatScreens.length - 1;

      sidebar.querySelectorAll(".screen-item").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      const activeBtn = sidebar.querySelector(".screen-item.active");
      if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    const themeToggle = document.getElementById("theme-toggle");

    const LIGHT_OVERRIDES = `:root {
      --color-bg-primary: #FAF8F5 !important;
      --color-bg-secondary: #F5F0EB !important;
      --color-bg-tertiary: #EDE6DD !important;
      --color-bg-elevated: #FFFFFF !important;
      --color-text-primary: #1A1A1A !important;
      --color-text-secondary: #4A4A4A !important;
      --color-text-tertiary: #7A7A7A !important;
      --color-border-default: #E5DFD8 !important;
      --color-border-subtle: #F0EBE5 !important;
      --color-primary: #B8860B !important;
      --color-accent: #C9A96E !important;
      --color-bg-overlay: rgba(26, 37, 47, 0.6) !important;
      --color-bg-scrim: rgba(26, 37, 47, 0.4) !important;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.06) !important;
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08) !important;
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.1) !important;
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12) !important;
      --card-bg: #FFFFFF !important;
      --card-border: #E5DFD8 !important;
      --input-bg: #FFFFFF !important;
      --input-border: #E5DFD8 !important;
    }`;

    const DARK_OVERRIDES = `:root {
      --color-bg-primary: #121212 !important;
      --color-bg-secondary: #1E1E1E !important;
      --color-bg-tertiary: #2A2A2A !important;
      --color-bg-elevated: #2A2A2A !important;
      --color-text-primary: #F5F0EB !important;
      --color-text-secondary: #C9C1B8 !important;
      --color-text-tertiary: #8A8078 !important;
      --color-border-default: #3A3530 !important;
      --color-border-subtle: #2A2520 !important;
      --color-primary: #D4A855 !important;
      --color-accent: #E2CFA0 !important;
      --color-bg-overlay: rgba(0, 0, 0, 0.7) !important;
      --color-bg-scrim: rgba(0, 0, 0, 0.5) !important;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.2) !important;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.25) !important;
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3) !important;
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.35) !important;
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.4) !important;
      --card-bg: #2A2A2A !important;
      --card-border: #3A3530 !important;
      --input-bg: #1E1E1E !important;
      --input-border: #3A3530 !important;
    }`;

    function applyThemeToIframe() {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc || !doc.head) return;
        let el = doc.getElementById("theme-override");
        if (!el) {
          el = doc.createElement("style");
          el.id = "theme-override";
          doc.head.appendChild(el);
        }
        el.textContent = currentTheme === "dark" ? DARK_OVERRIDES : LIGHT_OVERRIDES;
      } catch (e) {}
    }

    iframe.addEventListener("load", applyThemeToIframe);

    themeToggle.addEventListener("click", () => {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      themeToggle.classList.toggle("dark", currentTheme === "dark");
      applyThemeToIframe();
    });

    btnPrev.addEventListener("click", () => selectScreen(activeIndex - 1));
    btnNext.addEventListener("click", () => selectScreen(activeIndex + 1));
    btnOpenTab.addEventListener("click", () => {
      window.open(flatScreens[activeIndex].file, "_blank");
    });
    btnToggle.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });
    modeToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-toggle-btn");
      if (!btn || btn.dataset.mode === viewMode) return;
      setViewMode(btn.dataset.mode);
    });
    viewportToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".viewport-toggle-btn");
      if (!btn || btn.dataset.viewport === screenshotViewport) return;
      screenshotViewport = btn.dataset.viewport;
      viewportToggle.querySelectorAll(".viewport-toggle-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.viewport === screenshotViewport);
      });
      renderScreenshots(flatScreens[activeIndex]);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        selectScreen(activeIndex - 1);
      } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        selectScreen(activeIndex + 1);
      }
    });

    buildSidebar();
    selectScreen(0);
  </script>
</body>
</html>
