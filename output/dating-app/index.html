<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dating App — UI Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/project-viewer.css">
</head>
<body>
  <script>
    window.PROJECT_CONFIG = {
      title: "Dating App",
      backLink: "../../index.html",
      counterText: "14 screens",
      accent: "#E11D48",
      accentLight: "rgba(225, 29, 72, 0.08)",
      accentHover: "rgba(225, 29, 72, 0.14)",
      screenshotPaths: function (htmlFile) {
        var dir = htmlFile.includes("prototypes/") ? "prototypes" : "screens";
        var slug = htmlFile.split("/").pop().replace(".html", "");
        return {
          desktop: dir + "/screenshots/" + slug + "-desktop.png",
          mobile:  dir + "/screenshots/" + slug + "-mobile.png",
        };
      },
      screens: [
        { group: "Onboarding", items: [
          { num: 1,  file: "screens/welcome.html",            name: "Welcome",           desc: "Landing screen with value proposition" },
          { num: 2,  file: "screens/sign-up.html",            name: "Sign Up",            desc: "Registration with social + email auth" },
          { num: 3,  file: "screens/onboarding-profile.html", name: "Onboarding Profile", desc: "Profile setup \u2014 photos, bio, preferences" },
        ]},
        { group: "Discovery", items: [
          { num: 4,  file: "screens/discover.html", name: "Discover", desc: "Swipe-based profile discovery feed" },
          { num: 5,  file: "screens/matches.html",  name: "Matches",  desc: "View and manage mutual matches" },
        ]},
        { group: "Messaging", items: [
          { num: 6,  file: "screens/messages.html", name: "Messages", desc: "Conversation list with match threads" },
          { num: 7,  file: "screens/chat.html",     name: "Chat",     desc: "1-on-1 messaging with a match" },
        ]},
        { group: "Profile", items: [
          { num: 8,  file: "screens/profile.html",        name: "My Profile",     desc: "View and edit own profile" },
          { num: 9,  file: "screens/profile-detail.html", name: "Profile Detail", desc: "Expanded view of another user\u2019s profile" },
        ]},
        { group: "Settings & Utilities", items: [
          { num: 10, file: "screens/settings.html",      name: "Settings",      desc: "App preferences and account management" },
          { num: 11, file: "screens/notifications.html", name: "Notifications", desc: "Activity alerts and match updates" },
          { num: 12, file: "screens/states.html",        name: "States",        desc: "Empty, error, and loading states" },
        ]},
        { group: "Prototypes", type: "prototype", items: [
          { num: "P1", file: "prototypes/onboarding-discovery-flow.html", name: "Onboarding & Discovery Flow", desc: "Interactive onboarding-to-swipe prototype" },
          { num: "P2", file: "prototypes/secondary-flows.html",          name: "Secondary Flows",             desc: "Messaging, profile, settings interactions" },
        ]},
      ]
    };
  </script>
  <script src="../../shared/project-viewer.js"></script>
</body>
</html>
