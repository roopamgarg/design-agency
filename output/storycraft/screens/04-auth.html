<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryCraft — Sign In</title>
  <link rel="stylesheet" href="../system/tokens.css">
  <link rel="stylesheet" href="../system/components.css">
  <style>
    .auth-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-24);
    }

    .auth-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 400px;
      width: 100%;
      gap: var(--spacing-32);
    }

    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-xl);
      background: var(--primary-base);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-family: var(--font-ui);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      box-shadow: var(--shadow-lg);
      flex-shrink: 0;
    }

    .headline-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-8);
    }

    .headline-group p {
      font-size: var(--text-body-lg-size);
      line-height: var(--text-body-lg-lh);
      color: var(--text-secondary);
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-12);
      width: 100%;
    }

    .btn-social svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-16);
      width: 100%;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-group label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: var(--spacing-4);
      font-size: var(--text-caption-size);
      font-family: var(--font-ui);
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .password-toggle:hover {
      color: var(--text-secondary);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--primary-light);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    .input-group .input-field[type="password"],
    .input-group .input-field.has-toggle {
      padding-right: 64px;
    }

    .auth-footer {
      font-size: var(--text-caption-size);
      color: var(--text-secondary);
    }

    .auth-footer button {
      background: none;
      border: none;
      color: var(--primary-base);
      font-family: var(--font-ui);
      font-size: var(--text-caption-size);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      transition: color var(--transition-fast);
    }

    .auth-footer button:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .auth-footer button:focus-visible {
      outline: 2px solid var(--primary-light);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <main class="auth-page" role="main" aria-label="Authentication">
    <div class="auth-content">
      <div class="app-logo" role="img" aria-label="StoryCraft logo">SC</div>

      <div class="headline-group">
        <h1 class="h2">Welcome to StoryCraft</h1>
        <p>Your daily storytelling coach</p>
      </div>

      <div class="social-buttons">
        <button class="btn btn-social" type="button" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <button class="btn btn-social" type="button" aria-label="Continue with Apple">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          Continue with Apple
        </button>
      </div>

      <div class="divider" role="separator">or continue with email</div>

      <form class="form-section" aria-label="Email sign in form" onsubmit="event.preventDefault()">
        <div class="input-group">
          <label for="email-input">Email address</label>
          <input
            id="email-input"
            class="input-field"
            type="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
            aria-required="true"
          >
        </div>

        <div class="input-group">
          <label for="password-input">Password</label>
          <input
            id="password-input"
            class="input-field has-toggle"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            aria-required="true"
          >
          <button
            class="password-toggle"
            type="button"
            aria-label="Show password"
            onclick="togglePassword()"
            id="pw-toggle"
          >Show</button>
        </div>

        <button class="btn btn-primary btn-full" type="submit">Sign In</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <button type="button" aria-label="Switch to sign up">Sign up</button>
      </p>
    </div>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('password-input');
      const toggle = document.getElementById('pw-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.textContent = 'Hide';
        toggle.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        toggle.textContent = 'Show';
        toggle.setAttribute('aria-label', 'Show password');
      }
    }
  </script>
</body>
</html>
