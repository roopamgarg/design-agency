<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryCraft — Mic Permission</title>
  <link rel="stylesheet" href="../system/tokens.css">
  <link rel="stylesheet" href="../system/components.css">
  <style>
    .onboarding-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-24);
    }

    .onboarding-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      width: 100%;
      gap: var(--spacing-32);
    }

    .illustration {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, var(--primary-tint-10), rgba(129, 140, 248, 0.15));
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      line-height: 1;
      flex-shrink: 0;
    }

    .headline-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-12);
    }

    .headline-group p {
      font-size: var(--text-body-lg-size);
      line-height: var(--text-body-lg-lh);
      color: var(--text-secondary);
    }

    .test-area {
      background: var(--surface-elevated);
      border-radius: var(--radius-lg);
      padding: var(--spacing-24);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-16);
    }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 48px;
    }

    .visualizer-bar {
      width: 6px;
      border-radius: var(--radius-pill);
      background: var(--primary-light);
    }

    .visualizer-bar:nth-child(1) { height: 16px; animation: pulse-bar 1.2s ease-in-out 0s infinite; }
    .visualizer-bar:nth-child(2) { height: 28px; animation: pulse-bar 1.2s ease-in-out 0.15s infinite; }
    .visualizer-bar:nth-child(3) { height: 40px; animation: pulse-bar 1.2s ease-in-out 0.3s infinite; }
    .visualizer-bar:nth-child(4) { height: 48px; animation: pulse-bar 1.2s ease-in-out 0.45s infinite; }
    .visualizer-bar:nth-child(5) { height: 32px; animation: pulse-bar 1.2s ease-in-out 0.6s infinite; }
    .visualizer-bar:nth-child(6) { height: 20px; animation: pulse-bar 1.2s ease-in-out 0.75s infinite; }
    .visualizer-bar:nth-child(7) { height: 12px; animation: pulse-bar 1.2s ease-in-out 0.9s infinite; }

    @keyframes pulse-bar {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .test-caption {
      font-size: var(--text-caption-size);
      font-weight: 500;
      color: var(--text-secondary);
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-16);
      width: 100%;
    }

    .actions .btn-primary {
      min-width: 220px;
    }
  </style>
</head>
<body>
  <main class="onboarding-page" role="main" aria-label="Onboarding — Microphone Permission">
    <div class="onboarding-content">
      <div class="illustration" role="img" aria-label="Microphone illustration">
        🎤
      </div>

      <div class="headline-group">
        <h1 class="h2">Let's Hear You</h1>
        <p>StoryCraft needs microphone access to record your stories and provide real-time feedback on your delivery.</p>
      </div>

      <div class="test-area" role="region" aria-label="Audio test area">
        <div class="visualizer" aria-hidden="true">
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
        </div>
        <p class="test-caption">Say something — watch the waves!</p>
      </div>

      <nav class="progress-dots" aria-label="Onboarding progress">
        <span class="progress-dot" aria-label="Step 1 of 3"></span>
        <span class="progress-dot active" aria-label="Step 2 of 3, current"></span>
        <span class="progress-dot" aria-label="Step 3 of 3"></span>
      </nav>

      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Allow microphone access">Allow Microphone</button>
      </div>
    </div>
  </main>
</body>
</html>
