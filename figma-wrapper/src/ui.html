<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
    button { padding: 8px 16px; background-color: #18A0FB; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0D8DE2; }
    .error { color: red; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h2>Render Figma Nodes</h2>
  <p>Paste the specialized Figma JSON payload below:</p>
  <textarea id="json-input" placeholder="Paste JSON here..."></textarea>
  <button id="render-btn">Render in Figma</button>
  <div id="error-msg" class="error"></div>
</body>
</html>
