<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryCraft — Recording Studio</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .studio {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-6);
      position: relative;
    }

    .studio__close {
      position: absolute;
      top: var(--space-4);
      left: var(--space-4);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--color-elevated);
      font-size: var(--text-xl);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .studio__close:hover {
      background: var(--color-border);
    }

    .studio__prompt {
      font-family: var(--font-story);
      font-size: var(--text-lg);
      line-height: 1.6;
      text-align: center;
      max-width: 320px;
      margin-bottom: var(--space-10);
      color: var(--color-text-primary);
    }

    .studio__timer {
      font-family: var(--font-mono);
      font-size: 3rem;
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
    }

    .studio__status {
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-recording);
      margin-bottom: var(--space-8);
    }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 120px;
      margin-bottom: var(--space-10);
    }

    .visualizer__bar {
      width: 4px;
      border-radius: 2px;
      background: var(--color-recording);
      animation: pulse-bar 1.2s ease-in-out infinite;
    }

    @keyframes pulse-bar {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    .visualizer__bar:nth-child(1)  { height: 40px; animation-delay: 0.0s; }
    .visualizer__bar:nth-child(2)  { height: 60px; animation-delay: 0.1s; }
    .visualizer__bar:nth-child(3)  { height: 35px; animation-delay: 0.2s; }
    .visualizer__bar:nth-child(4)  { height: 80px; animation-delay: 0.3s; }
    .visualizer__bar:nth-child(5)  { height: 55px; animation-delay: 0.4s; }
    .visualizer__bar:nth-child(6)  { height: 90px; animation-delay: 0.5s; }
    .visualizer__bar:nth-child(7)  { height: 45px; animation-delay: 0.6s; }
    .visualizer__bar:nth-child(8)  { height: 70px; animation-delay: 0.7s; }
    .visualizer__bar:nth-child(9)  { height: 100px; animation-delay: 0.8s; }
    .visualizer__bar:nth-child(10) { height: 60px; animation-delay: 0.9s; }
    .visualizer__bar:nth-child(11) { height: 85px; animation-delay: 1.0s; }
    .visualizer__bar:nth-child(12) { height: 50px; animation-delay: 1.1s; }
    .visualizer__bar:nth-child(13) { height: 75px; animation-delay: 0.05s; }
    .visualizer__bar:nth-child(14) { height: 95px; animation-delay: 0.15s; }
    .visualizer__bar:nth-child(15) { height: 40px; animation-delay: 0.25s; }
    .visualizer__bar:nth-child(16) { height: 65px; animation-delay: 0.35s; }
    .visualizer__bar:nth-child(17) { height: 80px; animation-delay: 0.45s; }
    .visualizer__bar:nth-child(18) { height: 50px; animation-delay: 0.55s; }
    .visualizer__bar:nth-child(19) { height: 70px; animation-delay: 0.65s; }
    .visualizer__bar:nth-child(20) { height: 45px; animation-delay: 0.75s; }

    .controls {
      display: flex;
      align-items: center;
      gap: var(--space-8);
    }

    .record-fab--lg {
      animation: pulse-record 2s ease-in-out infinite;
    }

    @keyframes pulse-record {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Recording Studio</h1>

  <div class="studio" role="main" aria-label="Recording studio">
    <button class="studio__close" aria-label="Close recording studio">✕</button>

    <p class="studio__prompt">Tell about a time you overcame a fear.</p>

    <time class="studio__timer" aria-live="polite" aria-label="Recording time">02:34</time>
    <p class="studio__status" aria-live="polite">Recording…</p>

    <div class="visualizer" aria-hidden="true" role="img" aria-label="Audio visualizer">
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
      <div class="visualizer__bar"></div>
    </div>

    <div class="controls">
      <button class="icon-btn" aria-label="Restart recording">↺</button>
      <button class="record-fab record-fab--lg" aria-label="Stop recording">
        <span aria-hidden="true">■</span>
      </button>
      <button class="icon-btn" aria-label="Recording tips">💡</button>
    </div>
  </div>
</body>
</html>
