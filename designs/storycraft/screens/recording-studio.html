<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recording — StoryCraft</title>
    <link rel="stylesheet" href="../tokens.css">
    <style>
      /* ── Recording Studio Layout ── */

      .recording-studio {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--color-bg-primary);
        user-select: none;
        -webkit-user-select: none;
      }

      /* ── Top Bar ── */

      .recording-topbar {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-page-x);
        height: var(--header-height);
        flex-shrink: 0;
      }

      .recording-topbar__back {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--touch-target-min);
        height: var(--touch-target-min);
        border: none;
        background: none;
        cursor: pointer;
        color: var(--color-text-tertiary);
        border-radius: var(--radius-full);
        transition: color var(--transition-fast), background var(--transition-fast);
        flex-shrink: 0;
      }

      .recording-topbar__back:hover,
      .recording-topbar__back:focus-visible {
        color: var(--color-text-primary);
        background: var(--color-bg-secondary);
      }

      .recording-topbar__back svg {
        width: var(--icon-lg);
        height: var(--icon-lg);
      }

      .recording-topbar__center {
        flex: 1;
        min-width: 0;
        text-align: center;
      }

      .recording-topbar__prompt {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-secondary);
        line-height: var(--line-height-snug);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      .recording-topbar__timer {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-medium);
        color: var(--color-recording);
        font-variant-numeric: tabular-nums;
        letter-spacing: var(--letter-spacing-wide);
        margin-top: var(--space-0-5);
      }

      .recording-topbar__spacer {
        width: var(--touch-target-min);
        flex-shrink: 0;
      }

      /* ── Main Content Area ── */

      .recording-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-8) var(--space-page-x);
        gap: var(--space-10);
      }

      /* ── Waveform Visualization ── */

      .waveform-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-8);
        width: 100%;
      }

      .waveform {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--waveform-bar-gap);
        height: 120px;
        width: 100%;
        max-width: 300px;
      }

      .waveform__bar {
        width: var(--waveform-bar-width);
        border-radius: var(--radius-full);
        background: var(--waveform-active-color);
        opacity: 0.85;
        animation: waveform-bounce var(--bar-duration, 1s) var(--bar-delay, 0ms) ease-in-out infinite alternate;
        will-change: height, opacity;
      }

      @keyframes waveform-bounce {
        0% {
          height: var(--bar-min, 8px);
          opacity: 0.5;
        }
        50% {
          opacity: 0.9;
        }
        100% {
          height: var(--bar-max, 60px);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .waveform__bar {
          animation: none;
          height: var(--bar-max, 60px);
          opacity: 0.7;
        }
      }

      /* ── Framework Guide ── */

      .framework-guide {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-medium);
        letter-spacing: var(--letter-spacing-wide);
      }

      .framework-guide__step {
        color: var(--color-text-disabled);
        transition: color var(--transition-normal);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-full);
      }

      .framework-guide__step--active {
        color: var(--color-text-primary);
        background: var(--color-bg-secondary);
      }

      .framework-guide__arrow {
        color: var(--color-text-disabled);
        font-size: var(--font-size-xs);
      }

      /* ── Controls Area ── */

      .recording-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
        padding-bottom: env(safe-area-inset-bottom, var(--space-8));
        flex-shrink: 0;
      }

      .stop-button {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: var(--radius-full);
        background: var(--color-recording);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-glow-recording);
        transition: transform var(--transition-spring), box-shadow var(--transition-normal);
      }

      .stop-button::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: var(--radius-full);
        background: var(--color-recording-pulse);
        animation: stop-pulse 2s ease-in-out infinite;
        z-index: -1;
      }

      @keyframes stop-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.15);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stop-button::before {
          animation: none;
          opacity: 0.3;
        }
      }

      .stop-button:hover {
        transform: scale(1.06);
        box-shadow: 0 0 32px var(--color-recording-pulse);
      }

      .stop-button:active {
        transform: scale(0.96);
      }

      .stop-button__icon {
        width: 24px;
        height: 24px;
        border-radius: var(--radius-sm);
        background: var(--color-primary-contrast);
      }

      .pause-link {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-tertiary);
        background: none;
        border: none;
        cursor: pointer;
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-full);
        min-height: var(--touch-target-min);
        display: flex;
        align-items: center;
        transition: color var(--transition-fast);
      }

      .pause-link:hover,
      .pause-link:focus-visible {
        color: var(--color-text-secondary);
      }

      /* ── Recording indicator dot ── */

      .rec-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: var(--radius-full);
        background: var(--color-recording);
        margin-right: var(--space-1-5);
        animation: rec-blink 1.2s ease-in-out infinite;
        vertical-align: middle;
      }

      @keyframes rec-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @media (prefers-reduced-motion: reduce) {
        .rec-indicator {
          animation: none;
        }
      }

        .sr-only--focusable:focus-visible {
            position: fixed;
            top: var(--space-2);
            left: var(--space-2);
            width: auto;
            height: auto;
            padding: var(--space-2) var(--space-4);
            clip: auto;
            white-space: normal;
            overflow: visible;
            background: var(--color-primary);
            color: var(--color-primary-contrast);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            z-index: var(--z-max);
            box-shadow: var(--shadow-lg);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="sr-only sr-only--focusable">Skip to content</a>
    <div class="app-shell" data-screen="recording-studio">

              <span class="rec-indicator" aria-hidden="true"></span>
