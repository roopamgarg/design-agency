<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryCraft — UI Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/project-viewer.css">
</head>
<body>
  <script>
    window.PROJECT_CONFIG = {
      title: "StoryCraft",
      backLink: "../../index.html",
      counterText: "9 screens \u00b7 4 prototypes",
      accent: "#6366F1",
      accentLight: "rgba(99, 102, 241, 0.08)",
      accentHover: "rgba(99, 102, 241, 0.14)",
      screenshotPaths: function (htmlFile) {
        var slug = htmlFile.split("/").pop().replace(".html", "");
        var isProto = htmlFile.includes("prototypes/");
        return {
          desktop: isProto ? "prototypes/screenshots/" + slug + "-desktop.png" : "screenshots/" + slug + ".png",
          mobile:  isProto ? "prototypes/screenshots/" + slug + "-mobile.png"  : "screenshots/" + slug + ".png",
        };
      },
      screens: [
        { group: "Onboarding", items: [
          { num: 1, file: "screens/onboarding-welcome.html", name: "Welcome", desc: "Value proposition & get started" },
        ]},
        { group: "Core Experience", items: [
          { num: 2, file: "screens/daily-prompt.html",       name: "Daily Prompt",       desc: "Practice tab \u2014 today\u2019s prompt & streak" },
          { num: 3, file: "screens/recording-studio.html",   name: "Recording Studio",   desc: "Immersive recording interface" },
          { num: 4, file: "screens/feedback-dashboard.html", name: "Feedback Dashboard",  desc: "AI-powered voice & story analysis" },
          { num: 5, file: "screens/progress-overview.html",  name: "Progress Overview",   desc: "Streaks, rings, milestones" },
        ]},
        { group: "Discovery & Community", items: [
          { num: 6, file: "screens/track-discovery.html", name: "Track Discovery", desc: "Browse learning tracks" },
          { num: 7, file: "screens/community-home.html",  name: "Community Home",  desc: "Challenges, leaderboard, submissions" },
        ]},
        { group: "Profile & States", items: [
          { num: 8, file: "screens/profile-overview.html", name: "Profile Overview", desc: "Stats, badges, settings" },
          { num: 9, file: "screens/states.html",           name: "UI States",        desc: "Empty, loading, error states" },
        ]},
        { group: "Prototypes", type: "prototype", items: [
          { num: "P1", file: "prototypes/onboarding-flow.html",        name: "Onboarding Flow",        desc: "Welcome to first recording" },
          { num: "P2", file: "prototypes/daily-practice-flow.html",    name: "Daily Practice Flow",    desc: "Prompt \u2192 record \u2192 feedback" },
          { num: "P3", file: "prototypes/feedback-review-flow.html",   name: "Feedback Review Flow",   desc: "Detailed feedback exploration" },
          { num: "P4", file: "prototypes/progress-tracking-flow.html", name: "Progress Tracking Flow", desc: "Progress & milestone journey" },
        ]},
      ]
    };
  </script>
  <script src="../../shared/project-viewer.js"></script>
</body>
</html>
