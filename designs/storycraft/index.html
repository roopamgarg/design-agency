<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryCraft — UI Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --elevated: #F1F5F9;
      --text-1: #0F172A;
      --text-2: #475569;
      --text-3: #94A3B8;
      --border: #E2E8F0;
      --accent: #6366F1;
      --accent-light: rgba(99, 102, 241, 0.08);
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --sidebar-w: 320px;
      --toolbar-h: 48px;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-ui);
      color: var(--text-1);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: var(--toolbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background 150ms;
    }
    .back-link:hover { background: var(--elevated); text-decoration: none; }
    .back-link svg { width: 14px; height: 14px; }

    .top-divider { width: 1px; height: 20px; background: var(--border); }
    .project-title { font-size: 0.9375rem; font-weight: 700; color: var(--text-1); letter-spacing: -0.01em; }
    .top-bar-spacer { flex: 1; }
    .screen-counter { font-size: 0.75rem; font-weight: 500; color: var(--text-3); }

    .shell { flex: 1; display: flex; overflow: hidden; }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section { padding: 16px 12px 8px; }

    .sidebar-section-title {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .screen-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 120ms;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: var(--text-1);
    }
    .screen-item:hover { background: var(--elevated); }
    .screen-item.active { background: var(--accent-light); }
    .screen-item.active .screen-item-num { background: var(--accent); }

    .screen-item-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--elevated);
      color: var(--text-2);
      font-size: 0.6875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
    }
    .screen-item.active .screen-item-num { color: #fff; }

    .screen-item-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--elevated);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
    }
    .screen-item.active .screen-item-icon { background: var(--accent); color: #fff; }
    .screen-item-icon svg { width: 14px; height: 14px; }

    .screen-item-text { flex: 1; min-width: 0; }
    .screen-item-name { font-size: 0.8125rem; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .screen-item-desc { font-size: 0.6875rem; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .preview-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--elevated); }

    .preview-toolbar {
      height: var(--toolbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
    }

    .preview-nav-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 120ms;
    }
    .preview-nav-btn:hover:not(:disabled) { background: var(--elevated); }
    .preview-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .preview-nav-btn svg { width: 14px; height: 14px; }

    .preview-screen-name { flex: 1; font-size: 0.8125rem; font-weight: 600; color: var(--text-1); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .open-tab-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; font-family: inherit; font-size: 0.75rem; font-weight: 600;
      color: var(--accent); background: var(--accent-light);
      border: none; border-radius: var(--radius-sm); cursor: pointer;
      transition: background 120ms; white-space: nowrap;
    }
    .open-tab-btn:hover { background: rgba(99, 102, 241, 0.14); }
    .open-tab-btn svg { width: 12px; height: 12px; }

    .theme-toggle-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 120ms, color 120ms;
    }
    .theme-toggle-btn:hover { background: var(--elevated); }
    .theme-toggle-btn svg { width: 16px; height: 16px; }
    .theme-toggle-btn .icon-moon { display: none; }
    .theme-toggle-btn.dark { background: #1E1E2E; color: #F5F0EB; border-color: #3A3530; }
    .theme-toggle-btn.dark .icon-sun { display: none; }
    .theme-toggle-btn.dark .icon-moon { display: block; }

    .mode-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .mode-toggle-btn {
      padding: 5px 12px; font-family: inherit; font-size: 0.75rem; font-weight: 600;
      border: none; cursor: pointer; transition: background 120ms, color 120ms;
      background: var(--surface); color: var(--text-3);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .mode-toggle-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .mode-toggle-btn:hover { background: var(--elevated); color: var(--text-2); }
    .mode-toggle-btn.active { background: var(--accent); color: #fff; }
    .mode-toggle-btn svg { width: 12px; height: 12px; }

    .preview-frame-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
    .preview-frame-wrap[data-mode="screenshots"] { overflow-y: auto; align-items: flex-start; }

    .device-frame {
      width: 100%; max-width: 420px; height: 100%;
      background: var(--surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md); overflow: hidden;
      display: flex; flex-direction: column; border: 1px solid var(--border);
    }
    .device-frame iframe { flex: 1; width: 100%; border: none; background: #fff; }

    .screenshots-view {
      display: none; width: 100%; height: 100%; overflow-y: auto;
      padding: 24px; gap: 24px; flex-wrap: wrap;
      justify-content: center; align-items: flex-start; align-content: flex-start;
    }

    .preview-frame-wrap[data-mode="screenshots"] .device-frame { display: none; }
    .preview-frame-wrap[data-mode="screenshots"] .screenshots-view { display: flex; }

    .screenshot-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .screenshot-card-label { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); }
    .screenshot-card img { display: block; height: auto; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .screenshot-card.mobile img { max-width: 300px; width: 100%; }
    .screenshot-card.desktop img { max-width: 720px; width: 100%; }

    .sidebar {
      transition: margin-left 250ms ease, max-height 250ms ease, visibility 250ms, border-bottom-width 250ms;
    }

    .toggle-sidebar-btn {
      display: flex; width: 32px; height: 32px;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface); color: var(--text-2); cursor: pointer;
      align-items: center; justify-content: center; flex-shrink: 0;
      transition: background 120ms;
    }
    .toggle-sidebar-btn:hover { background: var(--elevated); }
    .toggle-sidebar-btn svg { width: 16px; height: 16px; }

    .open-tab-btn .btn-label { white-space: nowrap; }

    @media (min-width: 769px) {
      .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); visibility: hidden; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-w: 100%; }
      .shell { flex-direction: column; }
      .sidebar {
        width: 100%; max-height: 40vh; border-right: none;
        border-bottom: 1px solid var(--border); overflow: hidden;
      }
      .sidebar.collapsed { max-height: 0; visibility: hidden; border-bottom-width: 0; }
      .preview-frame-wrap { padding: 12px; }
      .device-frame { max-width: 100%; border-radius: var(--radius-md); }
      .open-tab-btn .btn-label { display: none; }
      .open-tab-btn { padding: 6px 8px; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../../index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      All Projects
    </a>
    <div class="top-divider"></div>
    <span class="project-title">StoryCraft</span>
    <span class="top-bar-spacer"></span>
    <span class="screen-counter" id="counter">9 screens &middot; 4 prototypes</span>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="preview-panel">
      <div class="preview-toolbar">
        <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle screen list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="preview-nav-btn" id="btn-prev" aria-label="Previous screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="preview-screen-name" id="preview-title">&mdash;</span>
        <button class="preview-nav-btn" id="btn-next" aria-label="Next screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="mode-toggle" id="mode-toggle">
          <button class="mode-toggle-btn" data-mode="live">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Live
          </button>
          <button class="mode-toggle-btn active" data-mode="screenshots">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Screenshots
          </button>
        </div>
        <button class="open-tab-btn" id="btn-open-tab" title="Open in new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span class="btn-label">Open in new tab</span>
        </button>
      </div>

      <div class="preview-frame-wrap" id="preview-frame-wrap">
        <div class="device-frame">
          <iframe id="preview-iframe" title="Screen preview"></iframe>
        </div>
        <div class="screenshots-view" id="screenshots-view">
          <div class="screenshot-card mobile">
            <span class="screenshot-card-label">Mobile</span>
            <img id="screenshot-mobile" alt="Mobile screenshot">
          </div>
          <div class="screenshot-card desktop">
            <span class="screenshot-card-label">Desktop</span>
            <img id="screenshot-desktop" alt="Desktop screenshot">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function screenshotPaths(htmlFile) {
      const slug = htmlFile.split("/").pop().replace(".html", "");
      const isProto = htmlFile.includes("prototypes/");
      return {
        desktop: isProto
          ? `prototypes/screenshots/${slug}-desktop.png`
          : `screenshots/${slug}.png`,
        mobile: isProto
          ? `prototypes/screenshots/${slug}-mobile.png`
          : `screenshots/${slug}.png`,
      };
    }

    const SCREENS = [
      { group: "Onboarding", items: [
        { num: 1, file: "screens/onboarding-welcome.html", name: "Welcome", desc: "Value proposition & get started" },
      ]},
      { group: "Core Experience", items: [
        { num: 2, file: "screens/daily-prompt.html",       name: "Daily Prompt",        desc: "Practice tab — today's prompt & streak" },
        { num: 3, file: "screens/recording-studio.html",   name: "Recording Studio",    desc: "Immersive recording interface" },
        { num: 4, file: "screens/feedback-dashboard.html",  name: "Feedback Dashboard",  desc: "AI-powered voice & story analysis" },
        { num: 5, file: "screens/progress-overview.html",  name: "Progress Overview",   desc: "Streaks, rings, milestones" },
      ]},
      { group: "Discovery & Community", items: [
        { num: 6, file: "screens/track-discovery.html",    name: "Track Discovery",     desc: "Browse learning tracks" },
        { num: 7, file: "screens/community-home.html",     name: "Community Home",      desc: "Challenges, leaderboard, submissions" },
      ]},
      { group: "Profile & States", items: [
        { num: 8, file: "screens/profile-overview.html",   name: "Profile Overview",    desc: "Stats, badges, settings" },
        { num: 9, file: "screens/states.html",             name: "UI States",           desc: "Empty, loading, error states" },
      ]},
      { group: "Prototypes", type: "prototype", items: [
        { num: "P1", file: "prototypes/onboarding-flow.html",         name: "Onboarding Flow",         desc: "Welcome to first recording" },
        { num: "P2", file: "prototypes/daily-practice-flow.html",     name: "Daily Practice Flow",     desc: "Prompt → record → feedback" },
        { num: "P3", file: "prototypes/feedback-review-flow.html",    name: "Feedback Review Flow",    desc: "Detailed feedback exploration" },
        { num: "P4", file: "prototypes/progress-tracking-flow.html",  name: "Progress Tracking Flow",  desc: "Progress & milestone journey" },
      ]},
    ];

    SCREENS.forEach(g => g.items.forEach(s => { s.screenshots = screenshotPaths(s.file); }));

    const flatScreens = SCREENS.flatMap(g => g.items);
    let activeIndex = 0;
    let viewMode = "screenshots";
    let currentTheme = "light";

    const sidebar        = document.getElementById("sidebar");
    const iframe         = document.getElementById("preview-iframe");
    const titleEl        = document.getElementById("preview-title");
    const btnPrev        = document.getElementById("btn-prev");
    const btnNext        = document.getElementById("btn-next");
    const btnOpenTab     = document.getElementById("btn-open-tab");
    const btnToggle      = document.getElementById("toggle-sidebar");
    const frameWrap      = document.getElementById("preview-frame-wrap");
    const screenshotsDiv = document.getElementById("screenshots-view");
    const modeToggle     = document.getElementById("mode-toggle");

    const protoIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

    function buildSidebar() {
      sidebar.innerHTML = SCREENS.map(group => `
        <div class="sidebar-section">
          <div class="sidebar-section-title">${group.group}</div>
          ${group.items.map(s => {
            const idx = flatScreens.indexOf(s);
            const isProto = group.type === "prototype";
            const badge = isProto
              ? `<span class="screen-item-icon">${protoIcon}</span>`
              : `<span class="screen-item-num">${s.num}</span>`;
            return `<button class="screen-item" data-idx="${idx}">
              ${badge}
              <div class="screen-item-text">
                <div class="screen-item-name">${s.name}</div>
                <div class="screen-item-desc">${s.desc}</div>
              </div>
            </button>`;
          }).join("")}
        </div>
      `).join("");

      sidebar.addEventListener("click", (e) => {
        const btn = e.target.closest(".screen-item");
        if (!btn) return;
        selectScreen(parseInt(btn.dataset.idx, 10));
      });
    }

    const screenshotMobileImg  = document.getElementById("screenshot-mobile");
    const screenshotDesktopImg = document.getElementById("screenshot-desktop");

    function renderScreenshots(s) {
      const ss = s.screenshots;
      screenshotMobileImg.src = ss.mobile;
      screenshotMobileImg.alt = `${s.name} — Mobile`;
      screenshotDesktopImg.src = ss.desktop;
      screenshotDesktopImg.alt = `${s.name} — Desktop`;
    }

    function setViewMode(mode) {
      viewMode = mode;
      frameWrap.dataset.mode = mode;
      modeToggle.querySelectorAll(".mode-toggle-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      const s = flatScreens[activeIndex];
      if (mode === "screenshots") {
        renderScreenshots(s);
        iframe.src = "about:blank";
      } else {
        iframe.src = s.file;
      }
    }

    function selectScreen(idx) {
      if (idx < 0 || idx >= flatScreens.length) return;
      activeIndex = idx;
      const s = flatScreens[idx];

      if (viewMode === "live") {
        iframe.src = s.file;
      } else {
        renderScreenshots(s);
      }

      titleEl.textContent = typeof s.num === "number" ? `${s.num}. ${s.name}` : s.name;
      btnPrev.disabled = idx === 0;
      btnNext.disabled = idx === flatScreens.length - 1;

      sidebar.querySelectorAll(".screen-item").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      const activeBtn = sidebar.querySelector(".screen-item.active");
      if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    const themeToggle = document.getElementById("theme-toggle");

    function applyThemeToIframe() {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc || !doc.documentElement) return;
        doc.documentElement.setAttribute("data-theme", currentTheme);
      } catch (e) {}
    }

    iframe.addEventListener("load", applyThemeToIframe);

    themeToggle.addEventListener("click", () => {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      themeToggle.classList.toggle("dark", currentTheme === "dark");
      applyThemeToIframe();
    });

    btnPrev.addEventListener("click", () => selectScreen(activeIndex - 1));
    btnNext.addEventListener("click", () => selectScreen(activeIndex + 1));
    btnOpenTab.addEventListener("click", () => { window.open(flatScreens[activeIndex].file, "_blank"); });
    btnToggle.addEventListener("click", () => { sidebar.classList.toggle("collapsed"); });
    modeToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-toggle-btn");
      if (!btn || btn.dataset.mode === viewMode) return;
      setViewMode(btn.dataset.mode);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); selectScreen(activeIndex - 1); }
      else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); selectScreen(activeIndex + 1); }
    });

    buildSidebar();
    frameWrap.dataset.mode = "screenshots";
    selectScreen(0);
  </script>
</body>
</html>
